name: quarterly-13f
# 13F 마감 45일 후 여유를 두고 분기 수집 (명세 5-1)
on:
  schedule:
    - cron: "0 3 15 2,5,8,11 *"
  workflow_dispatch:

concurrency:
  group: quarterly-13f
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r pipeline/requirements.txt

      - name: Fetch 13F
        env:
          HP_DATA_DIR: ${{ github.workspace }}/data
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python -m pipeline.quarterly.fetch_13f

      - name: Upload to R2
        env:
          HP_DATA_DIR: ${{ github.workspace }}/data
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python -m pipeline.daily.upload_r2 --prefix funds
