name: daily-us
# 미국장 마감 후 수집. 22:00 UTC 로 두면 EDT(20:00)·EST(21:00) 양쪽 커버 (명세 5-1)
on:
  schedule:
    - cron: "0 22 * * 1-5"
  workflow_dispatch:

concurrency:
  group: daily-us
  cancel-in-progress: false

env:
  HP_DATA_DIR: ${{ github.workspace }}/data
  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_BUCKET: ${{ secrets.R2_BUCKET }}

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r pipeline/requirements.txt

      - name: Fetch US OHLCV + universe
        run: python -m pipeline.daily.fetch_us

      # KR 유니버스/ETF parquet 를 받아와 병합·ETF 섹터 집계에 사용
      - name: Sync KR universe from R2
        run: |
          python -m pipeline.daily.sync_down --keys universe_kr.json
          python -m pipeline.daily.sync_down --prefix ohlcv/KR || true

      - name: Build universe.json (KR+US 병합)
        run: python -m pipeline.daily.build_universe

      - name: Build sectors (US, ETF)
        run: python -m pipeline.daily.build_sectors

      - name: Upload to R2
        run: python -m pipeline.daily.upload_r2
